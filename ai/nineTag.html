
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标环绕中心展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .orbit-container {
            position: relative;
            width: 600px;
            height: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 中心核心 */
        .core-center {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            z-index: 10;
            position: absolute;
            transition: transform 0.3s ease;
        }

        .core-center:hover {
            transform: scale(1.1);
        }

        /* 轨道环 */
        .orbit-ring {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        .ring-1 { width: 300px; height: 300px; animation: spin 60s linear infinite; }
        .ring-2 { width: 450px; height: 450px; animation: spin-reverse 80s linear infinite; }

        /* 指标卡片 */
        .metric-card {
            position: absolute;
            width: 140px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .metric-card:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            transform: scale(1.1) !important; /* Override inline transform on hover via JS logic if needed, but CSS hover works if we pause animation or use wrapper */
            z-index: 20;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .metric-icon {
            font-size: 24px;
            margin-bottom: 8px;
            color: #60a5fa;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .metric-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* 连接线 */
        .connector {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), transparent);
            transform-origin: left center;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* 脉冲动画 */
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #3b82f6;
            opacity: 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* 控制面板 */
        .control-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 20px;
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .btn-control {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-control:hover, .btn-control.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        /* 详情模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            width: 400px;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(20px);
            transition: transform 0.3s;
            position: relative;
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 20px;
        }
        
        .chart-placeholder {
            width: 100%;
            height: 150px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 10px;
        }
        
        .bar {
            width: 12px;
            background: #3b82f6;
            border-radius: 4px 4px 0 0;
            transition: height 0.5s ease;
        }

    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- 头部导航 -->
    <header class="w-full p-6 flex justify-between items-center z-50">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-chart-network text-blue-500 text-2xl">
            <h1 class="text-2xl font-bold tracking-wider text-white">NEXUS <span class="text-blue-500">DASHBOARD</span></h1>
        </div>
        <div class="flex gap-4 text-sm text-slate-400">
            <span><i class="fa-regular fa-clock mr-2"></i><span id="current-time">--:--:--</span></span>
            <span><i class="fa-solid fa-server mr-2"></i>System Online</span>
        </div>
    </header>

    <!-- 主展示区域 -->
    <main class="flex-1 relative flex justify-center items-center overflow-hidden">
        
        <!-- 背景装饰网格 -->
        <div class="absolute inset-0" style="background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 40px 40px;"></div>

        <div class="orbit-container" id="orbitContainer">
            <!-- 中心核心 -->
            <div class="core-center">
                <div class="pulse-ring"></div>
                <i class="fa-solid fa-microchip text-3xl text-white mb-2"></i>
                <span class="text-xs font-bold text-blue-100">CORE SYSTEM</span>
                <span class="text-[10px] text-blue-200 mt-1">v2.4.0</span>
            </div>

            <!-- 轨道环视觉辅助 -->
            <div class="orbit-ring ring-1"></div>
            <div class="orbit-ring ring-2"></div>

            <!-- 动态生成的指标将放在这里 -->
        </div>

    </main>

    <!-- 底部控制栏 -->
    <div class="control-panel">
        <button class="btn-control active" onclick="toggleAnimation(this)">运行动画</button>
        <button class="btn-control" onclick="changeLayout('circle')">圆形布局</button>
        <button class="btn-control" onclick="changeLayout('spiral')">螺旋布局</button>
        <button class="btn-control" onclick="refreshData()">刷新数据</button>
    </div>

    <!-- 详情模态框 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-modal" onclick="closeModal()"></i>
            <h2 class="text-xl font-bold text-white mb-1" id="modalTitle">指标详情</h2>
            <p class="text-sm text-slate-400 mb-4" id="modalDesc">实时数据监控分析</p>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="bg-slate-800 p-3 rounded-lg">
                    <div class="text-xs text-slate-500">当前值</div>
                    <div class="text-lg font-bold text-blue-400" id="modalValue">0</div>
                </div>
                <div class="bg-slate-800 p-3 rounded-lg">
                    <div class="text-xs text-slate-500">环比增长</div>
                    <div class="text-lg font-bold text-green-400" id="modalTrend">+0%</div>
                </div>
            </div>

            <div class="chart-placeholder" id="miniChart">
                <!-- JS生成条形图 -->
            
            
            <button class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition-colors" onclick="closeModal()">
                关闭详情
            </button>
        </div>
    </div>

    <script>
        // 配置数据
        const metricsData = [
            { id: 1, label: 'CPU 使用率', value: '45%', icon: 'fa-microchip', color: '#3b82f6', desc: '处理器核心负载情况' },
            { id: 2, label: '内存占用', value: '2.4GB', icon: 'fa-memory', color: '#8b5cf6', desc: '系统RAM实时占用' },
            { id: 3, label: '网络吞吐', value: '120MB/s', icon: 'fa-network-wired', color: '#10b981', desc: '上行与下行总带宽' },
            { id: 4, label: '磁盘I/O', value: '850 IOPS', icon: 'fa-hard-drive', color: '#f59e0b', desc: '存储读写操作频率' },
            { id: 5, label: '活跃用户', value: '1,240', icon: 'fa-users', color: '#ec4899', desc: '当前在线会话数量' },
            { id: 6, label: '错误日志', value: '12', icon: 'fa-bug', color: '#ef4444', desc: '过去一小时异常记录' },
            { id: 7, label: 'API 响应', value: '45ms', icon: 'fa-bolt', color: '#06b6d4', desc: '平均接口延迟时间' },
            { id: 8, label: '安全评分', value: '98/100', icon: 'fa-shield-halved', color: '#6366f1', desc: '系统安全防护等级' }
        ];

        let isAnimating = true;
        let currentLayout = 'circle';
        const container = document.getElementById('orbitContainer');
        const radiusInner = 150; // 内圈半径
        const radiusOuter = 220; // 外圈半径

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateTime();
            setInterval(updateTime, 1000);
            renderMetrics();
            generateMiniChart();
        });

        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
        }

        // 渲染指标卡片
        function renderMetrics() {
            // 清除旧的非核心非轨道元素
            const oldCards = document.querySelectorAll('.metric-card, .connector');
            oldCards.forEach(el => el.remove());

            const total = metricsData.length;
            const angleStep = (2 * Math.PI) / total;

            metricsData.forEach((data, index) => {
                // 决定在内圈还是外圈 (交替分布)
                const isInner = index % 2 === 0;
                const radius = isInner ? radiusInner : radiusOuter;
                
                // 计算角度
                const angle = index * angleStep - (Math.PI / 2); // 从顶部开始

                // 创建卡片
                const card = document.createElement('div');
                card.className = 'metric-card';
                card.innerHTML = `
                    <i class="fa-solid ${data.icon} metric-icon" style="color: ${data.color}"></i>
                    <div class="metric-value">${data.value}</div>
                    <div class="metric-label">${data.label}</div>
                `;
                
                // 定位卡片
                // 注意：这里我们直接计算绝对位置，而不是旋转父容器，这样卡片文字始终是正的
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                
                card.style.left = `calc(50% + ${x}px - 70px)`; // 70px是宽度的一半
                card.style.top = `calc(50% + ${y}px - 40px)`; // 40px大概是高度的一半
                
                // 点击事件
                card.onclick = () => openModal(data);

                container.appendChild(card);

                // 创建连接线 (从中心到卡片)
                // 简单的视觉线，实际项目中可以用SVG画更漂亮的贝塞尔曲线
                /* 
                   这里为了简化DOM操作，暂不生成物理连线DOM，
                   依靠视觉上的径向分布即可体现环绕感。
                   如果需要连线，可以计算中心点到card中心的距离和角度生成div。
                */
            });
        }

        // 模态框逻辑
        function openModal(data) {
            const modal = document.getElementById('detailModal');
            document.getElementById('modalTitle').innerText = data.label;
            document.getElementById('modalDesc').innerText = data.desc;
            document.getElementById('modalValue').innerText = data.value;
            document.getElementById('modalValue').style.color = data.color;
            
            // 随机生成趋势
            const trend = Math.floor(Math.random() * 20) - 5;
            const trendEl = document.getElementById('modalTrend');
            trendEl.innerText = (trend > 0 ? '+' : '') + trend + '%';
            trendEl.className = `text-lg font-bold ${trend >= 0 ? 'text-green-400' : 'text-red-400'}`;

            // 重新生成图表动画
            generateMiniChart();
            
            modal.classList.add('open');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('open');
        }

        // 生成简单的CSS条形图
        function generateMiniChart() {
            const chart = document.getElementById('miniChart');
            chart.innerHTML = '';
            for(let i=0; i<8; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                // 随机高度
                const h = Math.floor(Math.random() * 80) + 20;
                bar.style.height = '0%';
                chart.appendChild(bar);
                
                // 动画延时
                setTimeout(() => {
                    bar.style.height = h + '%';
                }, i * 50);
            }
        }

        // 控制按钮逻辑
        function toggleAnimation(btn) {
            isAnimating = !isAnimating;
            btn.classList.toggle('active');
            const rings = document.querySelectorAll('.orbit-ring');
            rings.forEach(ring => {
                ring.style.animationPlayState = isAnimating ? 'running' : 'paused';
            });
        }

        function changeLayout(type) {
            currentLayout = type;
            // 简单切换布局逻辑，这里主要演示概念
            // 实际可以改变radius的计算方式
            if(type === 'spiral') {
                // 螺旋布局逻辑略复杂，这里仅做提示或简单重排
                alert("螺旋布局模式已激活 (演示版保持圆形分布)");
            }
            refreshData();
        }

        function refreshData() {
            // 模拟数据更新
            metricsData.forEach(m => {
                if(m.label === 'CPU 使用率') m.value = Math.floor(Math.random() * 60 + 20) + '%';
                if(m.label === '活跃用户') m.value = (Math.floor(Math.random() * 500) + 1000).toLocaleString();
            });
            renderMetrics();
            
            // 闪烁效果提示更新
            const core = document.querySelector('.core-center');
            core.style.boxShadow = '0 0 50px rgba(59, 130, 246, 0.8)';
            setTimeout(() => {
                core.style.boxShadow = '0 0 30px rgba(59, 130, 246, 0.5)';
            }, 300);
        }

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') closeModal();
        });

    </script>
</body>
</html>
